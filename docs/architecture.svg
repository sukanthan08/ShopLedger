<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, routes, library modules, configuration, JSON database, and the numbered order placement flow.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #536176; }
    .section { font-size: 14px; font-weight: 700; fill: #334155; }
    .node-title { font-size: 13px; font-weight: 700; }
    .node-text { font-size: 12px; fill: #334155; }
    .small { font-size: 12px; fill: #536176; }
    .flow-num { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .flow-text { font-size: 12px; font-weight: 700; fill: #172033; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .ui { fill: #e8f1ff; stroke: #4f83cc; stroke-width: 1.5; }
    .server { fill: #eef2ff; stroke: #5966b3; stroke-width: 1.5; }
    .route { fill: #f4edff; stroke: #8b5fbf; stroke-width: 1.4; }
    .lib { fill: #edf8f1; stroke: #4f9b6e; stroke-width: 1.3; }
    .ticket { fill: #fff0e8; stroke: #d66b3d; stroke-width: 2.5; }
    .data { fill: #fff8df; stroke: #bd8b20; stroke-width: 1.5; }
    .flow { fill: #fff7ed; stroke: #e28a36; stroke-width: 1.5; }
    .arrow { stroke: #667085; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .flow-arrow { stroke: #d97706; stroke-width: 2; fill: none; marker-end: url(#flow-arrow); }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="38" class="title">ShopLedger architecture</text>
  <text x="32" y="61" class="subtitle">Node/Express POS · Khata ledger · GST invoicing · file-backed persistence</text>

  <!-- Main architecture area -->
  <rect x="24" y="82" width="1152" height="340" rx="12" class="panel"/>
  <text x="42" y="108" class="section">Runtime architecture</text>

  <!-- Browser UI -->
  <rect x="42" y="128" width="190" height="246" rx="10" class="ui"/>
  <text x="58" y="153" class="node-title">Browser UI</text>
  <text x="58" y="174" class="node-text">public/index.html</text>
  <text x="58" y="193" class="node-text">public/js/app.js</text>
  <text x="58" y="212" class="node-text">public/css/style.css</text>
  <line x1="58" y1="227" x2="215" y2="227" stroke="#9bb8e5"/>
  <text x="58" y="248" class="small">POS catalog &amp; cart</text>
  <text x="58" y="266" class="small">coupon preview</text>
  <text x="58" y="284" class="small">Khata customers</text>
  <text x="58" y="302" class="small">orders &amp; invoice links</text>
  <text x="58" y="320" class="small">GST reconciliation view</text>
  <text x="58" y="350" class="small">Calls /api/* via fetch</text>

  <!-- Server -->
  <rect x="270" y="128" width="170" height="246" rx="10" class="server"/>
  <text x="288" y="153" class="node-title">server.js</text>
  <text x="288" y="177" class="node-text">express()</text>
  <text x="288" y="196" class="node-text">bodyParser.json()</text>
  <text x="288" y="215" class="node-text">express.static(public)</text>
  <text x="288" y="239" class="node-text">/api → routers</text>
  <text x="288" y="258" class="node-text">/orders/:id/invoice</text>
  <text x="288" y="277" class="node-text">→ invoice.render</text>
  <text x="288" y="313" class="small">app.listen(config.port)</text>
  <text x="288" y="338" class="small">module.exports = app</text>

  <!-- Routes -->
  <rect x="474" y="118" width="232" height="264" rx="10" class="route"/>
  <text x="492" y="143" class="node-title">routes/ (mounted at /api)</text>
  <text x="492" y="168" class="node-text">products.js</text>
  <text x="507" y="185" class="small">GET /products, /coupons</text>
  <text x="492" y="211" class="node-text">orders.js</text>
  <text x="507" y="228" class="small">GET /orders, POST /orders</text>
  <text x="507" y="245" class="small">POST /orders/:id/cancel</text>
  <text x="492" y="271" class="node-text">customers.js</text>
  <text x="507" y="288" class="small">GET /customers</text>
  <text x="507" y="305" class="small">POST /customers/:id/settle</text>
  <text x="492" y="331" class="node-text">reports.js</text>
  <text x="507" y="348" class="small">dashboard, GST reconciliation</text>
  <text x="507" y="365" class="small">pricing preview, admin export</text>

  <!-- Libraries -->
  <rect x="734" y="118" width="240" height="264" rx="10" class="panel"/>
  <text x="752" y="143" class="node-title">lib/ business modules</text>
  <rect x="748" y="154" width="104" height="40" rx="6" class="lib"/>
  <text x="758" y="171" class="node-title">pricing.js</text>
  <text x="758" y="187" class="small">computeTotals</text>
  <rect x="862" y="154" width="98" height="40" rx="6" class="ticket"/>
  <text x="872" y="171" class="node-title">invoice.js</text>
  <text x="872" y="187" class="small">render</text>
  <rect x="748" y="204" width="104" height="40" rx="6" class="ticket"/>
  <text x="758" y="221" class="node-title">tax.js</text>
  <text x="758" y="237" class="small">getRateForItem</text>
  <rect x="862" y="204" width="98" height="40" rx="6" class="lib"/>
  <text x="872" y="221" class="node-title">coupons.js</text>
  <text x="872" y="237" class="small">calculateDiscount</text>
  <rect x="748" y="254" width="104" height="40" rx="6" class="lib"/>
  <text x="758" y="271" class="node-title">inventory.js</text>
  <text x="758" y="287" class="small">check / reserve</text>
  <rect x="862" y="254" width="98" height="40" rx="6" class="lib"/>
  <text x="872" y="271" class="node-title">orders.js</text>
  <text x="872" y="287" class="small">add / cancel</text>
  <rect x="748" y="304" width="104" height="40" rx="6" class="lib"/>
  <text x="758" y="321" class="node-title">ledger.js</text>
  <text x="758" y="337" class="small">Khata operations</text>
  <rect x="862" y="304" width="98" height="40" rx="6" class="lib"/>
  <text x="872" y="321" class="node-title">store.js</text>
  <text x="872" y="337" class="small">read / write / audit</text>
  <text x="752" y="368" class="small">dates.js · reports.js</text>

  <!-- Config and DB -->
  <rect x="1002" y="128" width="154" height="108" rx="10" class="data"/>
  <text x="1018" y="154" class="node-title">config.js</text>
  <text x="1018" y="176" class="node-text">port, shop</text>
  <text x="1018" y="194" class="node-text">HSN GST slabs</text>
  <text x="1018" y="212" class="node-text">coupons, adminKey</text>
  <rect x="1002" y="258" width="154" height="116" rx="10" class="data"/>
  <text x="1018" y="284" class="node-title">data/db.json</text>
  <text x="1018" y="306" class="node-text">products / stock</text>
  <text x="1018" y="324" class="node-text">orders / customers</text>
  <text x="1018" y="342" class="node-text">settlements / auditLog</text>
  <text x="1018" y="360" class="node-text">next IDs</text>

  <!-- Main connectors -->
  <path d="M232 250 H270" class="arrow"/>
  <path d="M440 250 H474" class="arrow"/>
  <path d="M706 250 H734" class="arrow"/>
  <path d="M974 190 H1002" class="arrow dash"/>
  <path d="M974 320 H1002" class="arrow"/>
  <text x="238" y="242" class="small">HTTP</text>
  <text x="446" y="242" class="small">dispatch</text>
  <text x="978" y="182" class="small">reads</text>
  <text x="978" y="312" class="small">read/write</text>

  <!-- Order flow -->
  <rect x="24" y="442" width="1152" height="326" rx="12" class="panel"/>
  <text x="42" y="468" class="section">Numbered flow: placing an order</text>
  <text x="42" y="489" class="subtitle">Observed path from public/js/app.js through routes/orders.js to data/db.json</text>

  <g>
    <circle cx="68" cy="530" r="14" fill="#d97706"/><text x="68" y="530" class="flow-num">1</text>
    <rect x="92" y="505" width="190" height="52" rx="8" class="flow"/>
    <text x="106" y="526" class="flow-text">UI submits cart</text>
    <text x="106" y="544" class="small">app.js → POST /api/orders</text>
  </g>
  <path d="M282 531 H320" class="flow-arrow"/>
  <g>
    <circle cx="340" cy="530" r="14" fill="#d97706"/><text x="340" y="530" class="flow-num">2</text>
    <rect x="364" y="505" width="196" height="52" rx="8" class="flow"/>
    <text x="378" y="526" class="flow-text">Resolve &amp; validate</text>
    <text x="378" y="544" class="small">store.read · inventory.find/check</text>
  </g>
  <path d="M560 531 H598" class="flow-arrow"/>
  <g>
    <circle cx="618" cy="530" r="14" fill="#d97706"/><text x="618" y="530" class="flow-num">3</text>
    <rect x="642" y="505" width="224" height="52" rx="8" class="flow"/>
    <text x="656" y="526" class="flow-text">Compute checkout totals</text>
    <text x="656" y="544" class="small">pricing.computeTotals → tax.js</text>
  </g>
  <path d="M866 531 H904" class="flow-arrow"/>
  <g>
    <circle cx="924" cy="530" r="14" fill="#d97706"/><text x="924" y="530" class="flow-num">4</text>
    <rect x="948" y="505" width="204" height="52" rx="8" class="flow"/>
    <text x="962" y="526" class="flow-text">Khata check if needed</text>
    <text x="962" y="544" class="small">ledger.chargeOrderToKhata</text>
  </g>

  <path d="M1050 557 V592 H1004" class="flow-arrow"/>
  <g>
    <circle cx="980" cy="616" r="14" fill="#d97706"/><text x="980" y="616" class="flow-num">5</text>
    <rect x="750" y="590" width="206" height="52" rx="8" class="flow"/>
    <text x="764" y="611" class="flow-text">Reserve inventory</text>
    <text x="764" y="629" class="small">inventory.reserve</text>
  </g>
  <path d="M750 616 H704" class="flow-arrow"/>
  <g>
    <circle cx="680" cy="616" r="14" fill="#d97706"/><text x="680" y="616" class="flow-num">6</text>
    <rect x="438" y="590" width="220" height="52" rx="8" class="flow"/>
    <text x="452" y="611" class="flow-text">Create order record</text>
    <text x="452" y="629" class="small">orders.add → db.orders.push</text>
  </g>
  <path d="M438 616 H392" class="flow-arrow"/>
  <g>
    <circle cx="368" cy="616" r="14" fill="#d97706"/><text x="368" y="616" class="flow-num">7</text>
    <rect x="124" y="590" width="220" height="52" rx="8" class="flow"/>
    <text x="138" y="611" class="flow-text">Audit and persist</text>
    <text x="138" y="629" class="small">appendAudit → store.write</text>
  </g>
  <path d="M234 642 V681 H300" class="flow-arrow"/>
  <g>
    <circle cx="324" cy="704" r="14" fill="#d97706"/><text x="324" y="704" class="flow-num">8</text>
    <rect x="348" y="678" width="452" height="52" rx="8" class="flow"/>
    <text x="364" y="699" class="flow-text">Saved result</text>
    <text x="364" y="717" class="small">data/db.json: stock, order, Khata totals, auditLog; response 201</text>
  </g>

  <!-- Legend -->
  <rect x="842" y="662" width="310" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="858" y="682" class="node-title">Legend</text>
  <rect x="858" y="692" width="15" height="15" rx="3" class="ticket"/><text x="881" y="704" class="small">Ticket focus: invoice.js + tax.js</text>
  <rect x="858" y="713" width="15" height="15" rx="3" class="route"/><text x="881" y="725" class="small">HTTP router</text>
  <rect x="1021" y="692" width="15" height="15" rx="3" class="data"/><text x="1044" y="704" class="small">persistent/config</text>
  <rect x="1021" y="713" width="15" height="15" rx="3" class="flow"/><text x="1044" y="725" class="small">order-flow step</text>
</svg>
